name: Pipelines

# Checks the creative pipelines in pipelines/ (see pipelines/README.md): every plugin's plugin.json and marketplace
# entry, every skill's README.md frontmatter and steps checklist in SKILL.md, a version bump on every changed plugin
# (pull requests only), each offline self-check, and the catalog itself with `claude plugin validate`. Spends
# nothing and needs no secrets.
on:
  push:
    branches: [marketing]
    paths:
      - "pipelines/**"
      - ".claude-plugin/**"
      - "scripts/pipelines-check.py"
      - ".github/workflows/pipelines.yml"
  pull_request:
    branches: [marketing]
    paths:
      - "pipelines/**"
      - ".claude-plugin/**"
      - "scripts/pipelines-check.py"
      - ".github/workflows/pipelines.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the version-bump check diffs against the base branch

      - name: Check each plugin.json, README.md and SKILL.md
        env:
          BASE: ${{ github.base_ref }}
        run: python3 scripts/pipelines-check.py ${BASE:+--base origin/$BASE}

      - name: Run each self-check
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in pipelines/*/scripts/selfcheck.py pipelines/*/skills/*/scripts/selfcheck.py; do
            echo "== $f"
            PYTHONDONTWRITEBYTECODE=1 python3 "$f"
          done

      - name: Validate the catalog
        run: npx -y @anthropic-ai/claude-code@2.1.309 plugin validate .
